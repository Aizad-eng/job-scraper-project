services:
  - type: web
    name: job-scraper
    runtime: node
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: APP_ACCESS_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: MONGO_URI
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: AI_ARK_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
